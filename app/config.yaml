manifest:
  superagent:
    description: "Super Agent learns your company, then helps you build products, plan projects and run agents."
    quick_prompts:
      - "Ask me about my company and what I'm working on."
      - "Set up my first Product and plan its first Project."
      - "Build an agent that turns meeting notes into action items."
      - "What needs my decision?"
  claude-engineer:
    description: "Claude Code, running on this repository. Ask it to explain, review or change the code."
    quick_prompts:
      - "What does this repository do? Answer in five lines."
      - "Which files do I change to add a new agent?"
      - "Find one thing worth fixing and show me the diff."
  codex-engineer:
    description: "Codex, running on this repository. Ask it to explain, review or change the code."
    quick_prompts:
      - "What does this repository do? Answer in five lines."
      - "Which files do I change to add a new agent?"
      - "Find one thing worth fixing and show me the diff."
