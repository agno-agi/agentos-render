    description: "Super-agent coordinates your agents to deliver outcomes."
    quick_prompts:
      - "Ask me about my company and what I'm working on."
      - "Propose one improvement to this AgentOS as a Project."
      - "Build an agent that turns meeting notes into action items."
  claude-1:
    description: "Claude Code, running on this repository."
    quick_prompts:
      - "How do I build a new agent?"
      - "What's the difference between an agent and a workflow."
      - "What does this repository do? Answer in five lines."
  codex-1:
    description: "Codex, running on this repository."
    quick_prompts:
      - "How do I build a new agent?"
      - "What's the difference between an agent and a workflow."
      - "What does this repository do? Answer in five lines."
  pr-to-merge-ready:
    description: "Gets a pull request to merge-ready: two engineers review it, triage keeps the real problems, one fixes them in a sandbox. Never pushes."
    quick_prompts:
      - "Get this PR to merge-ready: <pull request URL>"
