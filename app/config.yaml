manifest:
  superagent:
    description: "Ask for what you need. Super Agent plans the work, builds agents, teams and workflows, and checks the platform."
    quick_prompts:
      - "Ask me what my company does and what I'm working on."
      - "What work is in progress, and what needs my decision?"
      - "Build an agent that turns meeting notes into decisions, action items and open questions."
      - "Check platform health and tell me what needs attention."
  claude-engineer:
    description: "Explain, review, and improve repository code using Claude."
    quick_prompts:
      - "Explain how this repository starts AgentOS and connects its agents, database, and sandboxes. Point me to the relevant files."
      - "Review the repository for concrete bugs and setup problems. Prioritize findings with file references; do not change files."
      - "Run the documented local checks and fix the first reproducible failure with the smallest change. Report what you changed and verified."
  codex-engineer:
    description: "Investigate bugs, implement focused changes, and run repository checks using Codex."
    quick_prompts:
      - "Inspect the repository and summarize its setup, validation, and test commands without changing files."
      - "Review the development scripts for broken assumptions and unnecessary complexity. Recommend focused fixes without editing files."
      - "Run the documented local checks and fix the first reproducible failure with the smallest change. Report what you changed and verified."
