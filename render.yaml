# Render Blueprint for AgentOS.
#
# Launch it from the dashboard (New + → Blueprint, pointing at your copy of
# this repo). Set AGENTOS_URL and JWT_VERIFICATION_KEY in the API service's
# Environment settings, then save and deploy. See README.md for the full setup.
#
# Plans: `starter` is the cheapest web plan that never sleeps — the
# in-process scheduler and MCP streams need an always-on instance, so don't
# downgrade to `free`. One API instance is supported; see docs/scaling.md
# for the current limits. `basic-256mb` Postgres carries pgvector; the app runs
# CREATE EXTENSION itself.

services:
  - name: agent-os
    type: web
    runtime: docker
    plan: starter
    numInstances: 1    # supported configuration; limitations: docs/scaling.md
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    # API storage is ephemeral. Optional AgentCore checkpoints use S3, not an API disk.
    envVars:
      - key: OPENAI_API_KEY
        sync: false          # prompted at blueprint launch, stored as a secret
      # Add other model and integration credentials in the API service's
      # Environment settings, including ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN
      # for Claude Engineer, and any Parallel or Slack keys the application uses.
      - key: RUNTIME_ENV
        value: prd
      - key: WAIT_FOR_DB
        value: "True"
      - key: DB_HOST
        fromDatabase:
          name: agentos-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: agentos-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: agentos-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: agentos-db
          property: password
      - key: DB_DATABASE
        fromDatabase:
          name: agentos-db
          property: database

databases:
  - name: agentos-db
    plan: basic-256mb
    postgresMajorVersion: "17"
    databaseName: ai
    user: ai
