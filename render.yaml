# AgentOS on Render. See README.md for deployment and authentication setup.

projects:
  - name: AgentOS
    environments:
      - name: Production
        services:
          - name: agentos-api
            type: web
            runtime: docker
            region: virginia
            plan: 1c-2g  # 1 CPU, 2 GB RAM; always-on for scheduled work and MCP.
            numInstances: 1
            dockerfilePath: ./Dockerfile
            dockerContext: .
            healthCheckPath: /health
            autoDeployTrigger: commit
            envVars:
              - key: OPENAI_API_KEY
                sync: false
              - key: RUNTIME_ENV
                sync: false  # Enter dev for setup, then set prd in the dashboard.
              - key: SANDBOX_PROVIDER
                value: agentcore  # Used only when SANDBOX_ENABLED is True in code.
              - key: WAIT_FOR_DB
                value: "True"
              - key: DB_HOST
                fromDatabase:
                  name: agentos-db
                  property: host
              - key: DB_PORT
                fromDatabase:
                  name: agentos-db
                  property: port
              - key: DB_USER
                fromDatabase:
                  name: agentos-db
                  property: user
              - key: DB_PASS
                fromDatabase:
                  name: agentos-db
                  property: password
              - key: DB_DATABASE
                fromDatabase:
                  name: agentos-db
                  property: database

        databases:
          - name: agentos-db
            region: virginia
            plan: basic-256mb
            postgresMajorVersion: "18"
            databaseName: ai
            user: ai
