[project]
name = "AgentOS"
version = "1.0.0"
description = "AgentOS: a self-managing agent platform"
requires-python = ">=3.14,<4"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "Agno", email = "hello@agno.com" }]

dependencies = [
  # TEMPORARY: Agno main at 70be8704e1 until 3.2 is released. At release this becomes agno[...]==3.2.0.
  "agno[anthropic,cel,claude,codex,csv,docx,excel,mcp,openai,os,pdf,pgvector,psycopg,reportlab,slack,website,agentcore-sandbox] @ git+https://github.com/agno-agi/agno@70be8704e1776f9369106030f976112754cc06ac#subdirectory=libs/agno",
  "parallel-web",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["mypy", "ruff"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "app*", "db*", "evals*", "teams*"]
namespaces = false

[tool.ruff]
line-length = 120
exclude = [".venv*", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
# tmp/ is untracked scratch space — never part of the validated tree.
exclude = [".venv*", "tmp"]
